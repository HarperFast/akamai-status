name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      tag: ${{ steps.unpublished.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check format
        run: npm run format:check
      - name: Run unit tests
        run: npm test
      - name: Semantic Release
        run: npx --no semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Gated on npm rather than on this run's release, so re-running a run whose publish failed publishes it.
      # A re-run's HEAD predates its release commit, which only origin/main reaches.
      - name: Find the newest release missing from npm
        id: unpublished
        run: |
          tag=$({ git tag --list 'v*' --merged HEAD; git tag --list 'v*' --merged origin/main; } | sort -uV | tail -n 1)
          versions=$(npm view "$(node -p "require('./package.json').name")" versions --json)
          if ! jq -e --arg version "${tag#v}" 'index($version) != null' <<< "$versions" > /dev/null; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish
    needs: release
    if: ${{ needs.release.outputs.tag != '' }}
    environment: Release
    runs-on: ubuntu-latest
    # The OIDC token stays in a job that installs no dependencies, so only npm itself can use it
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$TAG"
          npm publish --provenance
