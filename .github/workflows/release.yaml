name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: Release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    environment: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Install dependencies
        run: npm ci
      - name: Check format
        run: npm run format:check
      - name: Run unit tests
        run: npm test
      - name: Semantic Release
        id: semantic
        if: ${{ github.event_name == 'push' }}
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # A manual run is for a release whose publish failed: it may only publish main's tagged release commit
      - name: Require main's HEAD to be the tagged release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          git tag --points-at HEAD | grep -qx "v$(node -p "require('./package.json').version")"
      - name: Publish to NPM
        if: ${{ steps.semantic.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch' }}
        run: npm publish --provenance
